status:
  scope: >-
    Compared declarations (Challenge.lean, restating every definition over Mathlib only): exact_degree_cheap and
    exact_degree_signed (the exact degree theorem over Z: IsLeast with value S(p^k) without inverse factors and
    S(p^((k+1)/2)) with them, for k >= 1); no_prime_detection (no member of the untwisted general family meets the
    prime-indicator target modulo p^k, k >= 1); degree_p_needed (with degrees in 0..p-1 target D is impossible);
    mod9_iff (the mod 9 criterion for degrees 1, 2, 3); d3_ternary (D_3(x) = floor(x^(1/3)) + 3H(x) for every x);
    piMod3_correct (the computable piMod3, a block routine for D_3 followed by the reduction from D_3 mod 9, equals
    pi(x) mod 3 for every x). Since version 1.3.0 also, from the preprint's version 2.0: blockStep_fast_path and
    blockStep_tail_short (Theorem 7.20 (2): the run-time checks of a block step pass, and the short final step),
    block_count (Theorem 7.20 (3): at most 4 (icbrt y + 1)(log2 y + 2) + 1 block steps), and normCount_one_and_eight_dvd,
    normCount_prime_pow, normCount_mod8, normCount_parity (Theorem 9.1: a weighted count of primitive representations
    by a^2 + 27 b^2 gives the parity of the number of primes of that form). The development (lean/) proves every theorem of the preprint, including the versions over
    rings of integers of number fields and Z_p, twisted factors, the explicit constructions and tables, the
    prime-counting identities, the Moebius link, Result M's identities and reductions, and the unequal-shift filters.
    Not compared: the operation-count bound of Theorem 7.20 (4), which lean/CostAll.lean proves for a counter defined in
    that file (the charges were checked by reading); the full x^(5/9) bound remains a paper proof. Results that need Chebotarev's density theorem are not formalized.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

