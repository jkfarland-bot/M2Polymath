  methods:
    - method: "agent"
      models: ["Claude (Anthropic)", "ChatGPT (OpenAI)"]
      framework: "Claude.ai with code execution (agent seats); ChatGPT for one research answer"
      tool_setup: >-
        AI-assisted throughout. ChatGPT (OpenAI) proposed several of the results in one research answer. Claude agent
        seats (Claude Opus) checked every result independently (a worker writing its own exact-arithmetic code, then a
        verifier or cold reader), wrote the Lean development in five rounds, and audited it: each round was rebuilt
        from source by the coordinating seat, scanned for axioms over every declaration, tested with one planted error
        per file, and read by a separate seat for statement fidelity and non-vacuity. The author directed the work.
      cost:
        wall_time: "9 to 20 November 2026, intermittent"
        spend_usd: "subscription-based"
        hardware: "cloud workspace (2 cores, 8 GB) plus local machine"
      prompting_notes: "Seats received written briefs with the statements to check or formalize, the source text treated as unreviewed claims, and the rule that no seat sees another's verdict before forming its own."
  spend_usd: "subscription-based"
  notes: >-
    The author chose the problems, directed the work, and is responsible for its content. Claude produced the Lean
    formalization and the paper's text under the author's direction. No external human referee has reviewed the paper
    or the formalization.

fidelity:
  divergences: >-
    Challenge.lean restates the development's definitions in namespace M2Polymath over Mathlib alone. The Kempner value
    is kempner p k = sInf {N | p^k divides N!}, the least such N. The core of degree z is zeta^z for z >= 0 and mu^|z| for
    z < 0 (zpowZeta). The family is a finite sum of c_z (G_z * h_z) over integer nodes (fam) or over any finite index set
    with arbitrary degrees (famI). Target D_k (TargetD p v k f) quantifies the offset v inside CheapAchievable and
    SignedAchievable, leaves the value at 1 and at higher prime powers free, and asks for vanishing modulo p^(v+k) at every
    n with at least two distinct prime factors. Corrections are required to vanish on squarefree m > 1, which allows any
    correction supported on 1 and the non-squarefree integers (a superset of the squarefull corrections used in the
    construction; this is the condition of the paper's Definition 2.7). ceil(k/2) is written (k+1)/2. The integer cube
    root floor(x^(1/3)) is icbrt, the greatest m <= x with m^3 <= x. The algorithm checks the approximation window of each
    block at run time and falls back to a direct sum when a check fails, so piMod3_correct holds unconditionally; whether
    the fast path is taken is not part of any theorem.

review:
  status: "self-assessed"
  reviewers:
    - "Joseph S. Farland"
  notes: >-
    Statements were audited for fidelity and non-vacuity by Claude seats that did not write them; the author compared
    the statements in Challenge.lean with the paper. The comparator compares every definition of Challenge.lean with
    its body (comparator.json has no definition holes); Solution.lean imports the same block from lean/ChallengeDefs.lean,
    checked identical by scripts/check-challenge-defs.py. No external referee has reviewed the paper or the formalization.

