version: "v0.4"

project:
  name: "M2Polymath: the exact degree of divisor-sum identities for the prime-counting function modulo prime powers"
  description: >-
    Consider integer combinations f = sum_z c_z (G_z * h_z) of Dirichlet convolutions in which each core G_z is the
    Dirichlet power zeta^z (z >= 0) or mu^|z| (z < 0) and each correction h_z vanishes on squarefree integers greater
    than 1. Target D_k asks that f(q) = p^v u_q (mod p^(v+k)) at every prime q with p not dividing u_q, and that
    f(n) = 0 (mod p^(v+k)) whenever n has at least two distinct prime factors; summing an f that meets a strong form of D_k (one value at every prime power) gives pi(x) modulo p^k.
    The development proves that, for every prime p and every k >= 1, the least Z for which some combination with
    degrees in {-Z..Z} meets D_k is S(p^ceil(k/2)), and with degrees in {1..Z} (no inverse factors) it is S(p^k),
    where S(m) is the least s with m dividing s! (the Kempner function). As corollaries no combination detects primes
    modulo p, and the divided target needs a degree divisible by p. It also proves D_3(x) = floor(x^(1/3)) + 3H(x),
    where H(x) counts triples (a, b, c) with abc <= x, a <= b and a < c, and certifies an algorithm for pi(x) mod 3
    through D_3.
  authors:
    - "Joseph S. Farland"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Joseph S. Farland"

